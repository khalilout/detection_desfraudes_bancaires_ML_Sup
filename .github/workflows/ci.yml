name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          pip install -r requirements-backend.txt
          pip install -r requirements-dev.txt

      - name: Vérifier la présence des artefacts du modèle
        run: |
          test -f models/fraud_model.joblib || (echo "models/fraud_model.joblib manquant — commitez le dossier models/ pour que les tests puissent charger le modèle." && exit 1)

      - name: Lancer la suite de tests
        run: pytest backend/tests/ -v